name: Keep portraits out of Git
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject raster photos in tracked files
        shell: bash
        run: |
          matches=$(git ls-files | grep -Ei '\.(bmp|jpe?g|png|webp|avif|heic|tiff?|gif|ico)$' || true)
          if [ -n "$matches" ]; then
            echo "Store portraits in private Drive, not GitHub. Remove these files:"
            echo "$matches"
            exit 1
          fi
