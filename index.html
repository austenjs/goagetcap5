<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Meet the people who make up the GoA community.">
  <title>GoA — Community Directory</title>
  <style>
    :root {
      --bg: #08101d;
      --surface: #101b2c;
      --surface-2: #152338;
      --text: #f4f7fb;
      --muted: #9eacc0;
      --line: rgba(255,255,255,.1);
      --accent: #6ee7b7;
      --accent-2: #60a5fa;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(96,165,250,.15), transparent 32rem),
        radial-gradient(circle at 88% 8%, rgba(110,231,183,.12), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button, input { font: inherit; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 760; letter-spacing: -.02em; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px; color: #071018; background: linear-gradient(135deg, var(--accent), #a7f3d0);
      box-shadow: 0 8px 24px rgba(110,231,183,.2);
    }
    .nav-note { color: var(--muted); font-size: 14px; }

    .hero { padding: 88px 0 54px; max-width: 820px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; color: var(--accent);
      font-size: 13px; font-weight: 760; text-transform: uppercase; letter-spacing: .13em;
    }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
    h1 { margin: 20px 0 18px; font-size: clamp(46px, 8vw, 82px); line-height: .98; letter-spacing: -.055em; }
    .hero p { margin: 0; max-width: 680px; color: var(--muted); font-size: clamp(18px, 2.4vw, 22px); line-height: 1.6; }

    .toolbar {
      position: sticky; top: 14px; z-index: 5;
      display: flex; align-items: center; gap: 14px; margin: 0 0 30px; padding: 12px;
      border: 1px solid var(--line); border-radius: 18px;
      background: rgba(16,27,44,.78); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    .search { position: relative; flex: 1; }
    .search svg { position: absolute; left: 15px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
    .search input {
      width: 100%; height: 48px; padding: 0 48px 0 46px; color: var(--text);
      border: 1px solid transparent; border-radius: 12px; outline: 0; background: rgba(255,255,255,.055);
      transition: border-color .2s, background .2s;
    }
    .search input:focus { border-color: rgba(110,231,183,.55); background: rgba(255,255,255,.08); }
    .search input::placeholder { color: #7f8da1; }
    .clear {
      position: absolute; right: 8px; top: 7px; width: 34px; height: 34px; border: 0; border-radius: 9px;
      color: var(--muted); background: transparent; cursor: pointer; opacity: 0; pointer-events: none;
    }
    .clear.show { opacity: 1; pointer-events: auto; }
    .clear:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .count { flex: none; padding: 0 12px; color: var(--muted); font-size: 14px; white-space: nowrap; }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding-bottom: 90px; }
    .card {
      position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(110,231,183,.32); box-shadow: var(--shadow); }
    .card-link { display: block; padding: 14px; text-decoration: none; }
    .portrait { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 14px; background: var(--surface-2); }
    .portrait img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .45s ease; }
    .portrait img[hidden], .initials[hidden] { display: none; }
    .initials { display: grid; place-items: center; width: 100%; height: 100%; font-size: 3rem; color: var(--accent, #9ee6ce); }
    .card:hover img { transform: scale(1.035); }
    .profile { display: flex; align-items: center; gap: 14px; padding: 18px 4px 7px; }
    .profile-copy { min-width: 0; flex: 1; }
    .profile h2 { margin: 0 0 5px; overflow: hidden; text-overflow: ellipsis; font-size: 18px; letter-spacing: -.025em; white-space: nowrap; }
    .profile p { margin: 0; color: var(--muted); font-size: 13px; }
    .arrow {
      width: 38px; height: 38px; display: grid; flex: none; place-items: center;
      color: var(--accent); border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.035);
      transition: color .2s, background .2s, border-color .2s;
    }
    .card:hover .arrow { color: #071018; border-color: var(--accent); background: var(--accent); }

    .empty { display: none; grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 28px 0 44px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; }

    @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero { padding-top: 64px; } }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 1180px); }
      .nav { height: 66px; } .nav-note { display: none; }
      .hero { padding: 52px 2px 36px; }
      .toolbar { top: 8px; margin-bottom: 18px; }
      .count { display: none; }
      .grid { grid-template-columns: 1fr; gap: 14px; padding-bottom: 60px; }
      .card-link { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 14px; }
      .portrait { aspect-ratio: 1; }
      .profile { padding: 0; }
      .profile h2 { white-space: normal; }
      .arrow { width: 34px; height: 34px; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="shell nav">
    <div class="brand"><span class="brand-mark">G</span><span>GoA Community</span></div>
    <span class="nav-note">People, connected.</span>
  </header>

  <main class="shell">
    <section class="hero">
      <span class="eyebrow">Community directory</span>
      <h1>Meet the GoA family.</h1>
      <p>A collection of friends, collaborators, and builders. Explore the directory and connect with the people behind the community.</p>
    </section>

    <section aria-label="Member directory">
      <div class="toolbar">
        <label class="search">
          <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search members</span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search by name" autocomplete="off">
          <button class="clear" id="clear" type="button" aria-label="Clear search">×</button>
        </label>
        <span class="count" id="count">16 members</span>
      </div>

      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="shell"><span>© <span id="year"></span> GoA Community</span><span>Built for connection.</span></footer>

  <script>
    const members = [
      ["Angel Clarita Juspi", "https://www.linkedin.com/in/angel-juspi/", "angel"],
      ["Otto Alexander Sutianto", "https://www.linkedin.com/in/otto-alexander/", "otto"],
      ["Mario Lorenzo", "https://www.linkedin.com/in/mario7lorenzo/", "mario"],
      ["Dick Jessen William", "https://www.linkedin.com/in/dickjessen/", "dick"],
      ["Fidella Widjojo", "https://www.linkedin.com/in/fidella-widjojo-896b24192/", "fidella"],
      ["Ivonne Khomas", "https://www.linkedin.com/in/ivonne-khomas-b939031a3/", "ivonne"],
      ["Hokiewan Thezeus", "https://www.linkedin.com/in/hokiewan-thezeus/", "hokiewan"],
      ["Matheus Aaron", "https://www.linkedin.com/in/matheusaaron/", "matheus"],
      ["Austin Santoso", "https://www.linkedin.com/in/austinsantoso/", "austin"],
      ["Geoffrey Bryan Lion", "https://www.linkedin.com/in/geoffreylion/", "geoffrey"],
      ["Austen Jeremy Sugiarto", "https://www.linkedin.com/in/austenjs/", "austen"],
      ["Jeff Ivanos Gana", "https://www.linkedin.com/in/jeffgana/", "jeff"],
      ["Alvin Gunawan", "https://www.linkedin.com/in/alvin-gunawan/", "alvin"],
      ["Alvon Gunawan", "https://www.linkedin.com/in/alvongunawan/", "alvon"],
      ["Vishandi Rudy Keneta", "https://www.linkedin.com/in/vishandi-rudy-keneta-22b89b186/", "vishandi"],
      ["Jonathan Kwok", "https://www.linkedin.com/in/jonathan-kwok-a159591b4/", "jonathan"]
    ].sort((a, b) => a[0].localeCompare(b[0]));

    const grid = document.querySelector('#grid');
    const search = document.querySelector('#search');
    const clear = document.querySelector('#clear');
    const count = document.querySelector('#count');

    const card = ([name, href, image]) => `
      <article class="card" data-name="${name.toLowerCase()}">
        <a class="card-link" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="View ${name}'s profile">
          <div class="portrait"><img data-member="${image}" alt="Portrait of ${name}" hidden><span class="initials" aria-hidden="true">${name.split(' ').map(part => part[0]).slice(0, 2).join('')}</span></div>
          <div class="profile">
            <div class="profile-copy"><h2>${name}</h2><p>${href.includes('instagram.com') ? 'Instagram' : 'LinkedIn'} profile</p></div>
            <span class="arrow" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7m0 0H9m8 0v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </a>
      </article>`;

    grid.innerHTML = members.map(card).join('') + '<div class="empty" id="empty"><strong>No matches found</strong>Try another name.</div>';

    // Set only after the Google-hosted service has passed its live checks.
    const portraitService = 'https://script.google.com/macros/s/AKfycbzHyx_fg_myITen2C7zLzGRqLM8DJJ8vRTipzIQa4CsAgUtP609YkibRHUkfprcoVo_/exec';
    const portraitImages = new Map([...grid.querySelectorAll('img[data-member]')].map(img => [img.dataset.member, img]));
    const scripts = new Map();
    const queue = [];
    const attempts = new Map();
    let activeRequests = 0;
    function finishPortrait(member, retry) {
      const request = scripts.get(member);
      if (!request) return;
      clearTimeout(request.timer);
      request.script.remove();
      scripts.delete(member);
      activeRequests--;
      if (retry && attempts.get(member) < 3) setTimeout(() => { queue.push(member); loadPortraits(); }, 1500);
      loadPortraits();
    }
    function loadPortraits() {
      while (queue.length && activeRequests < 3) {
        const member = queue.shift();
        if (scripts.has(member)) continue;
        attempts.set(member, (attempts.get(member) || 0) + 1);
        const script = document.createElement('script');
        script.src = `${portraitService}?member=${encodeURIComponent(member)}`;
        script.referrerPolicy = 'no-referrer';
        script.onerror = () => finishPortrait(member, true);
        const timer = setTimeout(() => finishPortrait(member, true), 30000);
        scripts.set(member, { script, timer });
        activeRequests++;
        document.head.append(script);
      }
    }
    window.goaPortrait = payload => {
      const img = portraitImages.get(payload && payload.member);
      if (img && typeof payload.image === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(payload.image)) {
        img.onload = () => { img.hidden = false; img.nextElementSibling.hidden = true; };
        img.src = payload.image;
      }
      finishPortrait(payload && payload.member, !payload?.image);
    };
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || !portraitService.startsWith('https://script.google.com/')) return;
        const member = entry.target.querySelector('img').dataset.member;
        queue.push(member);
        loadPortraits();
        observer.unobserve(entry.target);
      });
    }, { rootMargin: '300px' });
    grid.querySelectorAll('.portrait').forEach(portrait => observer.observe(portrait));

    function filterMembers() {
      const query = search.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('.card').forEach(item => {
        const match = item.dataset.name.includes(query);
        item.hidden = !match;
        if (match) shown++;
      });
      count.textContent = `${shown} ${shown === 1 ? 'member' : 'members'}`;
      clear.classList.toggle('show', Boolean(query));
      document.querySelector('#empty').style.display = shown ? 'none' : 'block';
    }

    search.addEventListener('input', filterMembers);
    clear.addEventListener('click', () => { search.value = ''; filterMembers(); search.focus(); });
    document.querySelector('#year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
